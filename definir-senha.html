<style>
  :root{
    --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#EAF1F7; --border:#D3DCE4;
    --blue:#33A9F4; --blue-2:#20A1FA; --red:#E14545; --text:#2D2D2D; --muted:#758A9C;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:radial-gradient(circle at 50% 0%, #ffffff 0%, var(--bg) 60%);
    color:var(--text); font-family:'Inter',system-ui,sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .page{width:100%; max-width:380px;}
  .topbar{display:flex; align-items:center; gap:12px; margin-bottom:20px;}
  .brand-logo{height:34px; width:auto; flex-shrink:0; display:block;}
  .topbar .name{font-family:'Oswald',sans-serif; font-weight:600; font-size:15px;}
  .topbar .sub{font-size:12px; color:var(--muted);}
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:18px;
    padding:22px; box-shadow:0 30px 60px -20px rgba(45,45,45,0.2);
  }
  .card h2{font-family:'Oswald',sans-serif; font-size:16px; margin:0 0 16px 0;}
  label{display:block; font-size:12.5px; color:var(--muted); margin:12px 0 5px 0;}
  input{
    width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    padding:10px 12px; border-radius:10px; font-size:14px; font-family:'Inter',sans-serif;
  }
  input:focus{outline:none; border-color:var(--blue);}
  .btn{
    width:100%; margin-top:18px; border:none; border-radius:20px; padding:11px 18px;
    font-size:14px; font-weight:600; cursor:pointer; font-family:'Inter',sans-serif;
    background:linear-gradient(135deg, var(--blue), var(--blue-2)); color:#ffffff;
  }
  .btn:disabled{opacity:.6; cursor:default;}
  .msg-erro{color:var(--red); font-size:13px; margin-top:12px;}
  .msg-ok{color:#3ecb6e; font-size:13px; margin-top:12px;}
  .status-row{display:flex; align-items:center; gap:10px; color:var(--muted); font-size:14px;}
  .spinner{
    width:18px;height:18px;border-radius:50%; border:2.5px solid var(--border); border-top-color:var(--blue);
    animation:spin .8s linear infinite; flex-shrink:0;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  a.btn-link{display:block; text-align:center; margin-top:14px; font-size:12.5px; color:var(--blue); text-decoration:none;}

  .a11y-fontctrl{
    position:fixed; bottom:14px; left:14px; z-index:999;
    display:flex; gap:4px; background:var(--surface); border:1px solid var(--border);
    border-radius:20px; padding:5px; box-shadow:0 10px 24px -10px rgba(45,45,45,0.25);
  }
  .a11y-fontctrl button{
    border:none; background:var(--surface-2); color:var(--text);
    width:30px; height:30px; border-radius:50%; font-size:12px; font-weight:700;
    cursor:pointer; font-family:'Inter',sans-serif;
  }
  .a11y-fontctrl button:hover{ background:var(--blue); color:#fff; }
</style>

<div class="page">
  <div class="topbar">
    <a href="index.html"><img class="brand-logo" src="logo_tabela_fipe_site_transparente.png" alt="TabelaFipe.Site"></a>
    <div>
      <div class="name">tabelafipe.site</div>
      <div class="sub">definir senha</div>
    </div>
  </div>

  <div class="card" id="card">
    <div class="status-row"><div class="spinner"></div> confirmando o link...</div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = "https://cklgxrebbjddhybbkzpn.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrbGd4cmViYmpkZGh5YmJrenBuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxNjEwNTcsImV4cCI6MjEwMDczNzA1N30.jGM0GPbNIFuAYQqVd4_Ikk21JK6jLOW5pCjg7909BSk";
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const card = document.getElementById('card');

function renderFormSenha(){
  card.innerHTML = `
    <h2>Criar sua senha</h2>
    <label>Nova senha</label>
    <input id="senha" type="password" placeholder="mínimo 6 caracteres" />
    <label>Confirmar senha</label>
    <input id="senha2" type="password" placeholder="repita a senha" />
    <button class="btn" id="btnSalvar">Salvar e entrar</button>
    <div id="msg"></div>
  `;
  const msg = document.getElementById('msg');
  document.getElementById('btnSalvar').onclick = async ()=>{
    const senha = document.getElementById('senha').value;
    const senha2 = document.getElementById('senha2').value;
    if(senha.length < 6){ msg.innerHTML = '<div class="msg-erro">A senha precisa ter pelo menos 6 caracteres.</div>'; return; }
    if(senha !== senha2){ msg.innerHTML = '<div class="msg-erro">As senhas não são iguais.</div>'; return; }
    const btn = document.getElementById('btnSalvar');
    btn.disabled = true; btn.textContent = 'Salvando...';
    const { error } = await supabase.auth.updateUser({ password: senha });
    if(error){
      btn.disabled = false; btn.textContent = 'Salvar e entrar';
      msg.innerHTML = '<div class="msg-erro">Não consegui salvar a senha. Tenta de novo.</div>';
      return;
    }
    location.href = 'vendedor.html';
  };
}

function renderLinkInvalido(){
  card.innerHTML = `
    <div class="msg-erro">Esse link expirou ou já foi usado.</div>
    <a class="btn-link" href="vendedor-login.html">⬅ Voltar pro login</a>
  `;
}

// supabase-js já processa o token da URL (detectSessionInUrl) ao inicializar;
// só precisamos aguardar a sessão aparecer.
async function iniciar(){
  const { data } = await supabase.auth.getSession();
  if(data.session){ renderFormSenha(); return; }

  supabase.auth.onAuthStateChange((event, session)=>{
    if(session) renderFormSenha();
  });

  setTimeout(async ()=>{
    const { data: novoCheck } = await supabase.auth.getSession();
    if(!novoCheck.session) renderLinkInvalido();
  }, 2500);
}

iniciar();
</script>

<div class="a11y-fontctrl" role="group" aria-label="Ajustar tamanho da fonte">
  <button type="button" data-step="-1" aria-label="Diminuir fonte">A-</button>
  <button type="button" data-step="0" aria-label="Tamanho padrão de fonte">A</button>
  <button type="button" data-step="1" aria-label="Aumentar fonte">A+</button>
</div>
<script>
(function(){
  var STEPS=[90,100,110,120,130];
  var salvo=parseInt(localStorage.getItem('tf_zoom'),10);
  var i=STEPS.indexOf(salvo); if(i===-1) i=STEPS.indexOf(100);
  document.querySelectorAll('.a11y-fontctrl button').forEach(function(btn){
    btn.addEventListener('click', function(){
      var step=btn.getAttribute('data-step');
      i = step==='0' ? STEPS.indexOf(100) : Math.min(STEPS.length-1, Math.max(0, i+parseInt(step,10)));
      var novo=STEPS[i];
      document.documentElement.style.zoom = novo + '%';
      localStorage.setItem('tf_zoom', novo);
    });
  });
})();
</script>
