<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tabelafipe.site — anúncios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14171a;
    --surface:#1e2226;
    --surface-2:#262b30;
    --border:#33393f;
    --amber:#FFB020;
    --amber-2:#FF8A00;
    --green:#25D366;
    --text:#EDEEF0;
    --muted:#8b92a0;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:radial-gradient(circle at 50% 0%, #1b1f23 0%, var(--bg) 60%);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:24px;
  }

  .page{width:100%; max-width:760px;}

  .topbar{display:flex; align-items:center; gap:12px; margin-bottom:18px;}
  .avatar{
    width:38px;height:38px;border-radius:50%;
    background:conic-gradient(from 220deg, var(--amber), var(--amber-2), var(--amber));
    display:flex;align-items:center;justify-content:center;
    font-family:'Oswald',sans-serif; font-weight:600; color:#14171a; font-size:15px;
    flex-shrink:0;
  }
  .topbar .name{font-family:'Oswald',sans-serif; font-weight:600; font-size:15px; letter-spacing:.3px;}
  .topbar .sub{font-size:12px; color:var(--muted);}
  .topbar-right{margin-left:auto; display:flex; gap:14px;}
  .topbar-right a{color:var(--muted); font-size:13px; text-decoration:none;}
  .topbar-right a:hover{color:var(--amber);}

  .filtros{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px;}
  .filtro-btn{
    background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    padding:7px 14px; border-radius:20px; font-size:13px; font-weight:500;
    cursor:pointer; font-family:'Inter',sans-serif;
  }
  .filtro-btn:hover{border-color:var(--amber); color:var(--amber);}
  .filtro-btn.ativo{background:linear-gradient(135deg, var(--amber), var(--amber-2)); color:#1a1204; border:none; font-weight:600;}

  .status-row{display:flex; align-items:center; gap:10px; color:var(--muted); font-size:14px;}
  .spinner{
    width:18px;height:18px;border-radius:50%;
    border:2.5px solid var(--border); border-top-color:var(--amber);
    animation:spin .8s linear infinite; flex-shrink:0;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:16px;}

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:18px; display:flex; flex-direction:column; gap:10px;
  }
  .card-head{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .card-title{font-family:'Oswald',sans-serif; font-weight:600; font-size:16px;}
  .card-tipo{font-size:11px; padding:3px 9px; border-radius:8px; border:1px solid var(--border); color:var(--muted); flex-shrink:0;}
  .card-local{font-size:12.5px; color:var(--muted);}
  .card-precos{display:flex; gap:14px; align-items:baseline; flex-wrap:wrap;}
  .preco-desejado{font-family:'JetBrains Mono', monospace; font-size:19px; font-weight:600; color:var(--amber);}
  .preco-fipe{font-size:11.5px; color:var(--muted);}
  .card-badges{display:flex; gap:6px; flex-wrap:wrap;}
  .badge{font-size:11px; padding:3px 9px; border-radius:8px; background:var(--surface-2); border:1px solid var(--border); color:var(--muted);}
  .card-texto{
    font-size:13px; line-height:1.5; color:var(--text);
    white-space:pre-wrap;
    max-height:110px; overflow:hidden; position:relative;
  }
  .card-texto.expandido{max-height:none;}
  .card-texto:not(.expandido)::after{
    content:""; position:absolute; bottom:0; left:0; right:0; height:32px;
    background:linear-gradient(180deg, transparent, var(--surface));
  }
  .ver-mais{background:none; border:none; color:var(--amber); font-size:12.5px; cursor:pointer; padding:0; text-align:left; font-family:'Inter',sans-serif;}
  .card-acoes{margin-top:4px;}
  .btn-whats{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--green); color:#08210f; text-decoration:none;
    padding:9px 16px; border-radius:20px; font-size:13px; font-weight:600;
  }

  .vazio{color:var(--muted); font-size:14px; text-align:center; padding:40px 0;}
  .anunciar-cta{
    margin-top:28px; text-align:center; padding:20px; background:var(--surface);
    border:1px solid var(--border); border-radius:16px;
  }
  .anunciar-cta a{color:var(--amber); text-decoration:none; font-weight:600;}
</style>
</head>
<body>

<div class="page">
  <div class="topbar">
    <div class="avatar">FP</div>
    <div>
      <div class="name">tabelafipe.site</div>
      <div class="sub">anúncios</div>
    </div>
    <div class="topbar-right">
      <a href="index.html">início</a>
      <a href="consultar.html">consultar preço</a>
    </div>
  </div>

  <div class="filtros" id="filtros">
    <button class="filtro-btn ativo" data-tipo="">Todos</button>
    <button class="filtro-btn" data-tipo="carros">🚗 Carros</button>
    <button class="filtro-btn" data-tipo="motos">🏍️ Motos</button>
    <button class="filtro-btn" data-tipo="caminhoes">🚚 Caminhões</button>
  </div>

  <div id="conteudo"><div class="status-row"><div class="spinner"></div> carregando anúncios...</div></div>

  <div class="anunciar-cta">
    Quer vender o seu? <a href="consultar.html">Consulte o preço e crie seu anúncio com IA →</a>
  </div>
</div>

<script>
/* ============================================================
   tabelafipe.site — listagem pública de anúncios
   Lê da view anuncios_publicos (sem telefone/email em texto puro;
   o contato é só via link do WhatsApp).
   ============================================================ */
const SUPABASE_URL = "https://cklgxrebbjddhybbkzpn.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrbGd4cmViYmpkZGh5YmJrenBuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxNjEwNTcsImV4cCI6MjEwMDczNzA1N30.jGM0GPbNIFuAYQqVd4_Ikk21JK6jLOW5pCjg7909BSk";

const TIPO_LABEL = { carros: "🚗 Carro", motos: "🏍️ Moto", caminhoes: "🚚 Caminhão" };

const conteudo = document.getElementById('conteudo');
const filtros = document.getElementById('filtros');
let tipoAtual = "";

async function carregarAnuncios(tipo){
  conteudo.innerHTML = `<div class="status-row"><div class="spinner"></div> carregando anúncios...</div>`;
  try{
    let url = `${SUPABASE_URL}/rest/v1/anuncios_publicos?select=*&order=criado_em.desc&limit=60`;
    if(tipo) url += `&tipo=eq.${tipo}`;
    const r = await fetch(url, {
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` }
    });
    if(!r.ok) throw new Error();
    const lista = await r.json();
    renderLista(lista);
  }catch(e){
    conteudo.innerHTML = `<div class="vazio">😕 Não consegui carregar os anúncios agora. Tenta recarregar a página.</div>`;
  }
}

function renderLista(lista){
  if(!lista.length){
    conteudo.innerHTML = `<div class="vazio">Ainda não há anúncios por aqui. Seja o primeiro a anunciar! 🚀</div>`;
    return;
  }
  const grid = document.createElement('div');
  grid.className = 'grid';
  lista.forEach(a=> grid.appendChild(criarCard(a)));
  conteudo.innerHTML = '';
  conteudo.appendChild(grid);
}

function criarCard(a){
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="card-head">
      <div class="card-title">${a.marca} ${a.modelo} ${a.ano_modelo ? `· ${a.ano_modelo}` : ''}</div>
      <span class="card-tipo">${TIPO_LABEL[a.tipo] || a.tipo}</span>
    </div>
    <div class="card-local">${[a.cidade, a.estado].filter(Boolean).join(' - ') || 'localização não informada'}</div>
    <div class="card-precos">
      ${a.valor_desejado ? `<span class="preco-desejado">${a.valor_desejado}</span>` : ''}
      ${a.valor_fipe ? `<span class="preco-fipe">FIPE: ${a.valor_fipe}</span>` : ''}
    </div>
    <div class="card-badges">
      ${a.cor ? `<span class="badge">🎨 ${a.cor}</span>` : ''}
      ${a.quilometragem ? `<span class="badge">🛣️ ${a.quilometragem}</span>` : ''}
      ${a.pneus ? `<span class="badge">🛞 pneus: ${a.pneus}</span>` : ''}
      ${a.estofados ? `<span class="badge">🪑 estofados: ${a.estofados}</span>` : ''}
    </div>
    <div class="card-texto">${a.texto || ''}</div>
    <button class="ver-mais">ver mais</button>
    <div class="card-acoes">
      ${a.whatsapp_link ? `<a class="btn-whats" href="${a.whatsapp_link}" target="_blank" rel="noopener">💬 Falar no WhatsApp</a>` : ''}
    </div>
  `;
  const textoEl = card.querySelector('.card-texto');
  const verMaisBtn = card.querySelector('.ver-mais');
  verMaisBtn.onclick = ()=>{
    textoEl.classList.toggle('expandido');
    verMaisBtn.textContent = textoEl.classList.contains('expandido') ? 'ver menos' : 'ver mais';
  };
  return card;
}

filtros.addEventListener('click', (e)=>{
  const btn = e.target.closest('.filtro-btn');
  if(!btn) return;
  filtros.querySelectorAll('.filtro-btn').forEach(b=>b.classList.remove('ativo'));
  btn.classList.add('ativo');
  tipoAtual = btn.dataset.tipo;
  carregarAnuncios(tipoAtual);
});

carregarAnuncios(tipoAtual);
</script>
</body>
</html>
